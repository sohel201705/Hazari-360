<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb">
<title>হাজারী ৩৬০</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100%;background:#f3f6fc}
body{color:#17233b;font-family:"Hind Siliguri","Noto Sans Bengali",Arial,sans-serif;font-weight:700}
button,input{font:inherit}button{cursor:pointer}
.app{width:100%;max-width:900px;margin:0 auto;padding:8px clamp(4px,1.5vw,12px) 16px}
.card{width:100%;background:#fff;border:1px solid #e2e8f3;border-radius:12px;padding:8px;margin:0 0 7px;box-shadow:0 2px 9px rgba(35,55,95,.05)}
.title{font-size:clamp(22px,5vw,29px);line-height:1.15;text-align:center;margin:0 0 7px;color:#1e3470;letter-spacing:.3px}
.name{width:100%;min-width:0;height:30px;border:1px solid #d8e0ef;border-radius:7px;background:#f8faff;text-align:center;padding:2px 1px;font-size:clamp(12px,2.8vw,16px);font-weight:900;color:#1c2942}
.name:focus,.score:focus{border-color:#4268ed;outline:0;box-shadow:0 0 0 2px rgba(66,104,237,.13)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:5px}
button{border:0;border-radius:8px;min-height:34px;padding:5px 8px;font-size:clamp(13px,3vw,16px);font-weight:900}
.primary{background:linear-gradient(135deg,#315efb,#2446c8);color:#fff}
.secondary{background:#edf2fb;color:#263858}
.table-card{padding:5px 3px 7px;overflow:hidden}
table{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:2px 3px}
thead th{font-size:clamp(11px,2.7vw,15px);line-height:1.05;padding:2px 1px;color:#34445f;white-space:normal;overflow-wrap:anywhere}
thead th:first-child{width:29px}
thead th:last-child{width:43px}
thead th:nth-child(2),thead th:nth-child(3),thead th:nth-child(4),thead th:nth-child(5){width:auto}
tbody td{text-align:center;padding:0}
.round{width:29px;font-size:clamp(13px,3vw,17px);color:#34445f}
.score{display:block;width:100%;height:34px;border:1px solid #dbe3f0;border-radius:7px;background:#fff;text-align:center;padding:2px 1px;font-size:clamp(17px,4vw,21px);font-weight:900;color:#17233b;min-width:0}
.score.auto-x{position:relative;z-index:2;pointer-events:auto;touch-action:manipulation;background:#fff3df;color:#a45b08;border-color:#f1d39f;font-weight:900;text-align:center;cursor:pointer}
.total{height:29px;border-radius:6px;background:#edf2fb;display:flex;align-items:center;justify-content:center;font-size:clamp(15px,3.5vw,18px);font-weight:900;color:#20345e}
.status{min-height:18px;border-radius:5px;margin-top:2px;font-size:clamp(9px,2.2vw,12px);font-weight:900;display:flex;align-items:center;justify-content:center;white-space:normal;padding:1px}
.ok{background:#e5f7ed;color:#14733d}.low{background:#fff3d6;color:#8a5b00}.high{background:#ffe5e5;color:#a12525}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.sum{min-width:0;background:#f1f5fc;border:1px solid #e4eaf5;border-radius:7px;text-align:center;padding:5px 2px;font-size:clamp(11px,2.6vw,14px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#53627d}
.sum b{display:block;font-size:clamp(17px,4vw,22px);margin-top:1px;color:#1d2e51}
.win{outline:2px solid #4268ed;background:#eaf0ff}
.history-title{font-size:17px;margin-bottom:6px}
.history-item{display:flex;align-items:center;justify-content:space-between;gap:6px;background:#f4f7fc;border:1px solid #e4eaf5;border-radius:8px;padding:7px;font-size:12px;margin-top:5px}
.history-item .info{min-width:0;overflow:hidden}
.history-item .buttons{display:flex;gap:4px;flex-shrink:0}
.history-item button{min-height:29px;font-size:11px;padding:3px 6px}
.note{text-align:center;font-size:12px;color:#75829a;margin-top:5px}
.add-round-wrap{padding:0 2px 6px}
.add-round{width:100%;background:#e9efff;color:#2448bd;border:1px solid #cfdbff}
@media(min-width:650px){.app{padding-top:12px}.card{padding:11px}.score{height:38px}}
</style>
</head>
<body>
<div class="app">
  <section class="card">
    <h1 class="title">HAZARI 360</h1>
    <div class="actions">
      <button class="primary" onclick="newGame()">New Game</button>
      <button class="secondary" onclick="toggleHistory()">History</button>
    </div>
  </section>

  <section class="card table-card">
    <table>
      <thead>
        <tr>
          <th>Round</th>
          <th id="h0">Player 1</th>
          <th id="h1">Player 2</th>
          <th id="h2">Player 3</th>
          <th id="h3">Player 4</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </section>

  <div class="add-round-wrap"><button class="add-round" onclick="addRound()">＋ আরও Round যোগ করুন</button></div>

  <section class="card">
    <div class="summary" id="summary"></div>
    <div class="note">প্রতি Roundের Total ৩৬০ হওয়া উচিত</div>
  </section>

  <section class="card" id="history" style="display:none">
    <div class="history-title">গেম History</div>
    <div id="historyList"></div>
  </section>
</div>

<script>
const KEY='hazari360_game_v7';
const HKEY='hazari360_history_v7';
const ROUNDS=10;

function fresh(){
  return {
    names:['Player 1','Player 2','Player 3','Player 4'],
    rounds:Array.from({length:ROUNDS},()=>[null,null,null,null])
  };
}
function load(){
  try{
    const saved=JSON.parse(localStorage.getItem(KEY));
    if(!saved||!Array.isArray(saved.rounds))return fresh();
    saved.names=Array.isArray(saved.names)?saved.names.slice(0,4):fresh().names;
    while(saved.names.length<4)saved.names.push('Player '+(saved.names.length+1));
    saved.rounds=saved.rounds.map(a=>{
      const row=Array.isArray(a)?a.slice(0,4):[null,null,null,null];
      while(row.length<4)row.push(null);
      return row.map(v=>v==='×'?'×':(v===null||v===undefined||v===''?null:Number(v)));
    });
    while(saved.rounds.length<ROUNDS)saved.rounds.push([null,null,null,null]);
    return saved;
  }catch(e){return fresh()}
}
let state=load();

function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function getHistory(){
  try{return JSON.parse(localStorage.getItem(HKEY))||[]}catch(e){return []}
}
function saveHistory(h){localStorage.setItem(HKEY,JSON.stringify(h.slice(0,20)))}

function renderNames(){ /* Player names are edited only once, in the table headers. */ }
function renderHeaders(){
  for(let i=0;i<4;i++){
    const th=document.getElementById('h'+i);
    th.innerHTML='';
    const el=document.createElement('input');
    el.className='name';
    el.value=state.names[i]||('Player '+(i+1));
    el.setAttribute('aria-label','Player '+(i+1)+' name');
    el.maxLength=18;
    el.oninput=()=>{
      state.names[i]=el.value;
      save();
      renderSummary();
    };
    th.appendChild(el);
  }
}
function focusScore(el){
  // পরের Roundে ঢুকলেই আগের ৩৬০-পূর্ণ Roundের ফাঁকা ঘরে X বসবে।
  const row=el.closest('tr');
  const currentRound=row?Array.from(row.parentElement.children).indexOf(row):-1;
  if(currentRound>0){
    for(let i=0;i<currentRound;i++)finalizeRound(i);
  }
  el.select();
}
function finalizeRound(r){
  const values=state.rounds[r];
  if(!values)return;
  const total=values.reduce((sum,v)=>sum+(typeof v==='number'?v:0),0);
  state.rounds[r]=values.map(v=>{
    if(total===360&&(v===null||v===undefined))return '×';
    if(total!==360&&v==='×')return null;
    return v;
  });
  save();
  updateRowDisplay(r);
}
function apply360Rule(r){
  const values=state.rounds[r];
  const total=values.reduce((sum,v)=>sum+(typeof v==='number'?v:0),0);
  // কেবল Roundের যোগফল ৩৬০ হলেই বাকি ফাঁকা ঘরে X বসবে।
  state.rounds[r]=values.map(v=>{
    if(total===360 && (v===null||v===undefined))return '×';
    if(total!==360 && v==='×')return null;
    return v;
  });
}
function makeScoreInput(cell,r,p,value=''){
  cell.innerHTML=`<input class="score" inputmode="numeric" pattern="[0-9]*" type="text" value="${value}" placeholder="—" autocomplete="off"
    onfocus="focusScore(this)" oninput="updateScoreLive(this,${r},${p})"
    onblur="blurScore(this,${r},${p})"
    onkeydown="if(event.key==='Enter')this.blur()">`;
}
function editX(r,p){
  state.rounds[r][p]=null;
  const row=document.querySelectorAll('#rows tr')[r];
  if(!row)return;
  makeScoreInput(row.children[p+1],r,p,'');
  save();
  updateRowDisplay(r);
  const input=row.children[p+1].querySelector('input');
  if(input){input.focus();input.select();}
}
function apply360Rule(r){
  const values=state.rounds[r];
  const total=values.reduce((sum,v)=>sum+(typeof v==='number'?v:0),0);
  state.rounds[r]=values.map(v=>{
    if(total===360&&(v===null||v===undefined))return '×';
    if(total!==360&&v==='×')return null;
    return v;
  });
}
function updateScoreLive(el,r,p){
  let raw=el.value.replace(/[^0-9]/g,'').trim();
  const otherTotal=state.rounds[r].reduce((sum,v,i)=>sum+(i!==p&&typeof v==='number'?v:0),0);
  const entered=raw===''?null:Math.max(0,parseInt(raw,10)||0);
  if(entered!==null&&entered+otherTotal>360){
    raw=String(Math.max(0,360-otherTotal));
    el.value=raw;
  }else if(el.value!==raw)el.value=raw;
  state.rounds[r][p]=raw===''?null:Math.max(0,parseInt(raw,10)||0);
  const liveTotal=state.rounds[r].reduce((sum,v)=>sum+(typeof v==='number'?v:0),0);
  if(liveTotal!==360)state.rounds[r]=state.rounds[r].map(v=>v==='×'?null:v);
  const row=el.closest('tr');
  for(let i=0;i<4;i++){
    if(i===p)continue;
    const cell=row.children[i+1],value=state.rounds[r][i];
    if(value==='×'){
      if(!cell.querySelector('.auto-x'))cell.innerHTML='<button type="button" class="score auto-x" onclick="editX('+r+','+i+')" aria-label="পয়েন্ট দিতে টাচ করুন">×</button>';
    }else if(!cell.querySelector('input.score')){
      makeScoreInput(cell,r,i,value??'');
    }
  }
  const values=state.rounds[r];
  const total=values.reduce((sum,v)=>sum+(typeof v==='number'?v:0),0);
  const completed=values.every(v=>v!==null&&v!==undefined);
  const status=row.querySelector('.status');
  row.querySelector('.total').textContent=total;
  status.textContent=completed?(total===360?'Perfect':(total<360?'Under':'Over')):'In Progress';
  status.className='status '+(completed?(total===360?'ok':(total<360?'low':'high')):'low');
  save();renderSummary();
}
function addRound(){
  state.rounds.push([null,null,null,null]);
  save();
  render();
  const inputs=document.querySelectorAll('#rows tr:last-child .score');
  if(inputs.length)inputs[0].focus();
}
function blurScore(el,r,p){
  const raw=el.value.replace(/[^0-9]/g,'').trim();
  if(el.value!==raw)el.value=raw;
  const otherTotal=state.rounds[r].reduce((sum,v,i)=>sum+(i!==p&&typeof v==='number'?v:0),0);
  let entered=raw===''?null:Math.max(0,parseInt(raw,10)||0);
  if(entered!==null&&entered+otherTotal>360){
    entered=Math.max(0,360-otherTotal);
    el.value=String(entered);
  }
  state.rounds[r][p]=entered;
  const liveTotal=state.rounds[r].reduce((sum,v)=>sum+(typeof v==='number'?v:0),0);
  if(liveTotal!==360)state.rounds[r]=state.rounds[r].map(v=>v==='×'?null:v);
  save();
  // Blur-এ কোনো DOM পরিবর্তন নয়: পাশের বক্সে টাচ করলে সেই ক্লিক অক্ষত থাকবে।
  const row=el.closest('tr');
  if(row){
    const values=state.rounds[r];
    const total=values.reduce((s,v)=>s+(typeof v==='number'?v:0),0);
    const done=values.every(v=>v!==null&&v!==undefined);
    row.querySelector('.total').textContent=total;
    const st=row.querySelector('.status');
    st.textContent=done?(total===360?'Perfect':(total<360?'Under':'Over')):'In Progress';
    st.className='status '+(done?(total===360?'ok':(total<360?'low':'high')):'low');
  }
  renderSummary();
}
function updateRowDisplay(r){
  const row=document.querySelectorAll('#rows tr')[r];
  if(!row)return;
  for(let p=0;p<4;p++){
    const cell=row.children[p+1],v=state.rounds[r][p];
    if(v==='×'){
      if(!cell.querySelector('.auto-x'))cell.innerHTML='<button type="button" class="score auto-x" onclick="editX('+r+','+p+')" aria-label="পয়েন্ট দিতে টাচ করুন">×</button>';
    }else if(!cell.querySelector('input.score')){
      makeScoreInput(cell,r,p,v??'');
    }else if(document.activeElement!==cell.querySelector('input.score')){
      cell.querySelector('input.score').value=v??'';
    }
  }
  const total=state.rounds[r].reduce((s,v)=>s+(typeof v==='number'?v:0),0);
  const done=state.rounds[r].every(v=>v!==null&&v!==undefined);
  row.querySelector('.total').textContent=total;
  const st=row.querySelector('.status');
  st.textContent=done?(total===360?'Perfect':(total<360?'Under':'Over')):'In Progress';
  st.className='status '+(done?(total===360?'ok':(total<360?'low':'high')):'low');
  renderSummary();
}
function renderSummary(){
  const totals=[0,0,0,0];
  state.rounds.forEach(a=>a.forEach((v,i)=>totals[i]+=typeof v==='number'?v:0));
  const max=Math.max(...totals);
  document.getElementById('summary').innerHTML=totals.map((v,i)=>
    `<div class="sum ${v===max&&max>0?'win':''}">
      ${escapeHtml(state.names[i]||('Player '+(i+1)))}<b>${v}</b>
    </div>`
  ).join('');
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function render(){
  renderNames();
  renderHeaders();
  const rows=document.getElementById('rows');
  rows.innerHTML='';
  state.rounds.forEach((a,r)=>{
    const tr=document.createElement('tr');
    let cells=`<td class="round">${r+1}</td>`;
    for(let p=0;p<4;p++){
      if(a[p]==='×'){
        cells+=`<td><button type="button" class="score auto-x" onclick="editX(${r},${p})" aria-label="পয়েন্ট দিতে টাচ করুন">×</button></td>`;
      }else{
        const val=a[p]===null||a[p]===undefined?'':a[p];
        cells+=`<td>
          <input class="score" inputmode="numeric" pattern="[0-9]*" type="text" value="${val}" placeholder="—" autocomplete="off"
            onfocus="focusScore(this)" onclick="focusScore(this)"
            oninput="updateScoreLive(this,${r},${p})"
            onblur="blurScore(this,${r},${p})"
            onkeydown="if(event.key==='Enter')this.blur()">
        </td>`;
      }
    }
    const total=a.reduce((x,y)=>x+(typeof y==='number'?y:0),0);
    const completed=a.every(v=>v!==null&&v!==undefined);
    const cls=completed?(total===360?'ok':(total<360?'low':'high')):'low';
    const txt=completed?(total===360?'Perfect':(total<360?'Under':'Over')):'In Progress';
    cells+=`<td><div class="total">${total}</div><div class="status ${cls}">${txt}</div></td>`;
    tr.innerHTML=cells;
    rows.appendChild(tr);
  });
  renderSummary();
  renderHistory();
}
function newGame(){
  const hasScore=state.rounds.some(a=>a.some(v=>v!==null&&v!==undefined&&v!=='×'));
  if(hasScore){
    const h=getHistory();
    h.unshift({
      time:new Date().toLocaleString('bn-BD'),
      names:[...state.names],
      rounds:state.rounds.map(a=>[...a])
    });
    saveHistory(h);
  }
  state={
    names:[...state.names],
    rounds:Array.from({length:ROUNDS},()=>[0,0,0,0])
  };
  save();
  render();
  window.scrollTo(0,0);
}
function toggleHistory(){
  const el=document.getElementById('history');
  el.style.display=el.style.display==='none'?'block':'none';
  renderHistory();
}
function renderHistory(){
  const list=document.getElementById('historyList');
  const h=getHistory();
  if(!h.length){
    list.innerHTML='<div style="font-size:10px;color:#7b8497">No previous games</div>';
    return;
  }
  list.innerHTML=h.map((g,i)=>{
    const totals=[0,0,0,0];
    g.rounds.forEach(a=>a.forEach((v,p)=>totals[p]+=typeof v==='number'?v:0));
    return `<div class="history-item">
      <div class="info">${escapeHtml(g.time)}<br>${escapeHtml(g.names.join(' · '))}<br>${totals.join(' / ')}</div>
      <div class="buttons">
        <button class="secondary" onclick="restoreGame(${i})">Restore</button>
        <button class="secondary" onclick="deleteHistory(${i})">Delete</button>
      </div>
    </div>`;
  }).join('');
}
function restoreGame(i){
  const h=getHistory();
  if(!h[i])return;
  state={
    names:[...h[i].names],
    rounds:h[i].rounds.map(a=>a.map(v=>v==='×'?'×':(v===null||v===undefined?null:Number(v))))
  };
  save();
  render();
  document.getElementById('history').style.display='none';
  window.scrollTo(0,0);
}
function deleteHistory(i){
  const h=getHistory();
  h.splice(i,1);
  saveHistory(h);
  renderHistory();
}
render();
</script>
</body>
</html>
