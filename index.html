<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f5f7fb">
<title>হাজারী ৩৬০</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:#172033;font-family:Arial,"Noto Sans Bengali",sans-serif;font-weight:700}
.app{width:100%;max-width:620px;margin:auto;padding:10px}
.card{background:#fff;border:1px solid #e5e9f2;border-radius:14px;padding:10px;margin-bottom:9px;box-shadow:0 2px 10px rgba(30,50,90,.05)}
h1{font-size:20px;text-align:center;margin:2px 0 9px}
.names{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
input{font:inherit;outline:none}
.name{width:100%;border:1px solid #d8deea;border-radius:9px;padding:8px 5px;text-align:center;font-size:13px;background:#fbfcff}
.name:focus,.score:focus{border-color:#6d8cff;box-shadow:0 0 0 2px rgba(109,140,255,.12)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
button{border:0;border-radius:9px;padding:9px 7px;font:inherit;font-size:13px;cursor:pointer}
.primary{background:#315efb;color:white}.secondary{background:#edf1f7;color:#24304a}
table{width:100%;border-collapse:separate;border-spacing:3px}
th{font-size:12px;padding:5px 2px}
td{text-align:center}
.round{width:34px;font-size:12px}
.score{width:100%;min-width:0;border:1px solid #d8deea;border-radius:8px;padding:7px 2px;text-align:center;font-size:14px;background:#fff}
.total{font-size:14px;padding:7px 1px;background:#f2f5fa;border-radius:7px}
.status{font-size:11px;text-align:center;padding:5px;border-radius:7px;margin:2px 0}
.ok{background:#e8f8ee;color:#14733d}.low{background:#fff4d8;color:#8a5b00}.high{background:#ffe7e7;color:#a12525}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.sum{background:#f3f5f9;border-radius:9px;text-align:center;padding:7px 3px;font-size:12px}
.sum b{display:block;font-size:15px;margin-top:2px}
.win{outline:2px solid #315efb;background:#eaf0ff}
.history-title{font-size:14px;margin-bottom:6px}
.history-item{display:flex;justify-content:space-between;align-items:center;gap:6px;background:#f5f7fb;border-radius:8px;padding:7px;margin-top:5px;font-size:11px}
.history-item button{padding:6px 8px;font-size:11px}
.note{text-align:center;font-size:10px;color:#7b8497;margin:7px 0 2px}
@media(max-width:380px){.app{padding:7px}.card{padding:7px}.names{gap:4px}.name{font-size:11px}.score{font-size:12px;padding:6px 1px}th{font-size:10px}.sum{font-size:10px}.sum b{font-size:13px}}
</style>
</head>
<body>
<div class="app">
<div class="card">
<h1>হাজারী ৩৬০</h1>
<div class="names" id="names"></div>
<div class="actions">
<button class="primary" onclick="newGame()">নতুন গেম</button>
<button class="secondary" onclick="toggleHistory()">হিস্ট্রি</button>
</div>
</div>

<div class="card">
<table>
<thead><tr><th class="round">রাউন্ড</th><th id="h0">১</th><th id="h1">২</th><th id="h2">৩</th><th id="h3">৪</th><th>মোট</th></tr></thead>
<tbody id="rows"></tbody>
</table>
</div>

<div class="card">
<div class="summary" id="summary"></div>
<div class="note">প্রতি রাউন্ডের মোট = ৩৬০ হওয়া উচিত</div>
</div>

<div class="card" id="history" style="display:none">
<div class="history-title">গেম হিস্ট্রি</div>
<div id="historyList"></div>
</div>
</div>

<script>
const KEY='hazari360_game_v6';
const HKEY='hazari360_history_v6';
const ROUNDS=30;

function fresh(){
  return {names:['খেলোয়াড় ১','খেলোয়াড় ২','খেলোয়াড় ৩','খেলোয়াড় ৪'],
          rounds:Array.from({length:ROUNDS},()=>[0,0,0,0])};
}
function load(){
  try{return JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){return fresh()}
}
let state=load();

function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function getHistory(){
  try{return JSON.parse(localStorage.getItem(HKEY))||[]}catch(e){return []}
}
function saveHistory(h){localStorage.setItem(HKEY,JSON.stringify(h.slice(0,20)))}

function renderNames(){
  const box=document.getElementById('names'); box.innerHTML='';
  state.names.forEach((n,i)=>{
    const el=document.createElement('input');
    el.className='name'; el.value=n;
    el.setAttribute('aria-label','খেলোয়াড় '+(i+1));
    el.oninput=()=>{state.names[i]=el.value;save();renderHeaders()};
    box.appendChild(el);
  });
}
function renderHeaders(){
  for(let i=0;i<4;i++)document.getElementById('h'+i).textContent=state.names[i]||('খেলোয়াড় '+(i+1));
}
function focusScore(el){
  if(el.value==='0') el.value='';
}
function blurScore(el,r,p){
  if(el.value.trim()==='') el.value='0';
  let v=Math.max(0,parseInt(el.value,10)||0);
  el.value=v;
  state.rounds[r][p]=v; save(); render();
}
function render(){
  renderNames(); renderHeaders();
  const rows=document.getElementById('rows'); rows.innerHTML='';
  state.rounds.forEach((a,r)=>{
    const tr=document.createElement('tr');
    let cells='<td class="round">'+(r+1)+'</td>';
    for(let p=0;p<4;p++){
      cells+=`<td><input class="score" inputmode="numeric" type="number" min="0" value="${a[p]}"
        onclick="focusScore(this)" onfocus="focusScore(this)"
        onblur="blurScore(this,${r},${p})"
        onkeydown="if(event.key==='Enter')this.blur()"></td>`;
    }
    const total=a.reduce((x,y)=>x+y,0);
    let cls=total===360?'ok':(total<360?'low':'high');
    let txt=total===360?'ঠিক ৩৬০':(total<360?'কম':'বেশি');
    cells+=`<td><div class="total">${total}</div><div class="status ${cls}">${txt}</div></td>`;
    tr.innerHTML=cells; rows.appendChild(tr);
  });
  const totals=[0,0,0,0];
  state.rounds.forEach(a=>a.forEach((v,i)=>totals[i]+=v));
  const max=Math.max(...totals);
  document.getElementById('summary').innerHTML=totals.map((v,i)=>
    `<div class="sum ${v===max&&max>0?'win':''}">${state.names[i]||('খেলোয়াড় '+(i+1))}<b>${v}</b></div>`).join('');
  renderHistory();
}
function newGame(){
  const hasScore=state.rounds.some(a=>a.some(v=>Number(v)>0));
  if(hasScore){
    const h=getHistory();
    h.unshift({time:new Date().toLocaleString('bn-BD'),names:[...state.names],rounds:state.rounds.map(a=>[...a])});
    saveHistory(h);
  }
  state={names:[...state.names],rounds:Array.from({length:ROUNDS},()=>[0,0,0,0])};
  save(); render();
  window.scrollTo(0,0);
}
function toggleHistory(){
  const el=document.getElementById('history');
  el.style.display=el.style.display==='none'?'block':'none';
  renderHistory();
}
function renderHistory(){
  const list=document.getElementById('historyList'), h=getHistory();
  if(!h.length){list.innerHTML='<div style="font-size:11px;color:#7b8497">কোনো পুরোনো গেম নেই</div>';return}
  list.innerHTML=h.map((g,i)=>{
    const totals=[0,0,0,0]; g.rounds.forEach(a=>a.forEach((v,p)=>totals[p]+=v));
    return `<div class="history-item"><span>${g.time}<br>${g.names.join(' · ')}</span>
      <span>${totals.join(' / ')}
      <button class="secondary" onclick="restoreGame(${i})">Restore</button>
      <button class="secondary" onclick="deleteHistory(${i})">Delete</button></span></div>`;
  }).join('');
}
function restoreGame(i){
  const h=getHistory(); if(!h[i])return;
  state={names:[...h[i].names],rounds:h[i].rounds.map(a=>[...a])};
  save(); render(); document.getElementById('history').style.display='none';
}
function deleteHistory(i){
  const h=getHistory(); h.splice(i,1); saveHistory(h); renderHistory();
}
render();
</script>
</body>
</html>
