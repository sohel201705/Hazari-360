<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb">
<title>হাজারী ৩৬০</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100%;background:#f3f6fc}
body{color:#17233b;font-family:"Hind Siliguri","Noto Sans Bengali",Arial,sans-serif;font-weight:700}
button,input{font:inherit}button{cursor:pointer}
.app{width:100%;max-width:980px;margin:0 auto;padding:12px 9px 24px}
.card{width:100%;background:#fff;border:1px solid #e2e8f3;border-radius:16px;padding:12px;margin:0 0 10px;box-shadow:0 5px 18px rgba(35,55,95,.06)}
.title{font-size:28px;line-height:1.25;text-align:center;margin:0 0 12px;color:#1e3470;letter-spacing:.2px}
.names{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.name{width:100%;min-width:0;height:46px;border:1.5px solid #d8e0ef;border-radius:11px;background:#f8faff;text-align:center;padding:6px 3px;font-size:16px;font-weight:800;color:#1c2942}
.name:focus,.score:focus{border-color:#4268ed;outline:0;box-shadow:0 0 0 3px rgba(66,104,237,.13)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
button{border:0;border-radius:11px;min-height:44px;padding:8px 10px;font-size:16px;font-weight:800}
.primary{background:linear-gradient(135deg,#315efb,#2446c8);color:#fff;box-shadow:0 4px 10px rgba(49,94,251,.18)}
.secondary{background:#edf2fb;color:#263858}
.table-card{padding:8px 5px 10px;overflow-x:auto}
table{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:3px 6px}
thead th{font-size:15px;line-height:1.2;padding:6px 2px;color:#455675;white-space:normal;overflow-wrap:anywhere}
thead th:first-child{width:36px}
thead th:last-child{width:52px}
tbody td{text-align:center;padding:0}
.round{width:36px;font-size:16px;color:#53627d}
.score{display:block;width:100%;height:44px;border:1.5px solid #dbe3f0;border-radius:10px;background:#fff;text-align:center;padding:5px 1px;font-size:19px;font-weight:800;color:#17233b;min-width:0}
.score.auto-x{position:relative;z-index:2;pointer-events:auto;touch-action:manipulation;background:#fff3df;color:#a45b08;border-color:#f1d39f;font-weight:900;text-align:center;cursor:pointer}
.total{height:38px;border-radius:10px;background:#edf2fb;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;color:#20345e}
.status{min-height:25px;border-radius:8px;margin-top:4px;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;white-space:normal;padding:2px}
.ok{background:#e5f7ed;color:#14733d}.low{background:#fff3d6;color:#8a5b00}.high{background:#ffe5e5;color:#a12525}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.sum{min-width:0;background:#f1f5fc;border:1px solid #e4eaf5;border-radius:11px;text-align:center;padding:9px 3px;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#53627d}
.sum b{display:block;font-size:21px;margin-top:3px;color:#1d2e51}
.win{outline:2px solid #4268ed;background:#eaf0ff}
.history-title{font-size:19px;margin-bottom:9px}
.history-item{display:flex;align-items:center;justify-content:space-between;gap:7px;background:#f4f7fc;border:1px solid #e4eaf5;border-radius:10px;padding:9px;font-size:14px;margin-top:7px}
.history-item .info{min-width:0;overflow:hidden}
.history-item .buttons{display:flex;gap:5px;flex-shrink:0}
.history-item button{min-height:36px;font-size:13px;padding:5px 8px}
.note{text-align:center;font-size:14px;color:#75829a;margin-top:9px}
.add-round-wrap{padding:0 3px 10px}
.add-round{width:100%;background:#e9efff;color:#2448bd;border:1px solid #cfdbff}
@media(max-width:380px){
 .app{padding:8px 5px 18px}.card{padding:9px;border-radius:13px}
 .table-card{padding:6px 2px 8px}
 table{border-spacing:2px 5px}
 thead th{font-size:13px;padding:5px 1px}
 thead th:first-child{width:30px}thead th:last-child{width:45px}
 .round{width:30px;font-size:14px}
 .score{height:41px;font-size:17px;border-radius:8px}
 .total{height:35px;font-size:15px}.status{font-size:11px;min-height:23px}
 .name{height:43px;font-size:14px}.sum{font-size:12px}.sum b{font-size:19px}
}
@media(min-width:700px){
 .app{padding:18px 16px 28px}.card{padding:16px;border-radius:18px}
 .score{height:48px;font-size:20px}.name{height:48px;font-size:17px}
 thead th{font-size:16px}.total{height:42px;font-size:18px}.status{font-size:13px}
}
</style>
</head>
<body>
<div class="app">
  <section class="card">
    <h1 class="title">হাজারী ৩৬০</h1>
    <div class="names" id="names"></div>
    <div class="actions">
      <button class="primary" onclick="newGame()">নতুন গেম</button>
      <button class="secondary" onclick="toggleHistory()">হিস্ট্রি</button>
    </div>
  </section>

  <section class="card table-card">
    <table>
      <thead>
        <tr>
          <th>রাউন্ড</th>
          <th id="h0">খেলোয়াড় ১</th>
          <th id="h1">খেলোয়াড় ২</th>
          <th id="h2">খেলোয়াড় ৩</th>
          <th id="h3">খেলোয়াড় ৪</th>
          <th>মোট</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </section>

  <div class="add-round-wrap"><button class="add-round" onclick="addRound()">＋ আরও রাউন্ড যোগ করুন</button></div>

  <section class="card">
    <div class="summary" id="summary"></div>
    <div class="note">প্রতি রাউন্ডের মোট ৩৬০ হওয়া উচিত</div>
  </section>

  <section class="card" id="history" style="display:none">
    <div class="history-title">গেম হিস্ট্রি</div>
    <div id="historyList"></div>
  </section>
</div>

<script>
const KEY='hazari360_game_v7';
const HKEY='hazari360_history_v7';
const ROUNDS=10;

function fresh(){
  return {
    names:['খেলোয়াড় ১','খেলোয়াড় ২','খেলোয়াড় ৩','খেলোয়াড় ৪'],
    rounds:Array.from({length:ROUNDS},()=>[null,null,null,null])
  };
}
function load(){
  try{
    const saved=JSON.parse(localStorage.getItem(KEY));
    if(!saved||!Array.isArray(saved.rounds))return fresh();
    saved.names=Array.isArray(saved.names)?saved.names.slice(0,4):fresh().names;
    while(saved.names.length<4)saved.names.push('খেলোয়াড় '+(saved.names.length+1));
    saved.rounds=saved.rounds.map(a=>{
      const row=Array.isArray(a)?a.slice(0,4):[null,null,null,null];
      while(row.length<4)row.push(null);
      return row.map(v=>v==='×'?'×':(v===null||v===undefined||v===''?null:Number(v)));
    });
    while(saved.rounds.length<ROUNDS)saved.rounds.push([null,null,null,null]);
    return saved;
  }catch(e){return fresh()}
}
let state=load();

function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function getHistory(){
  try{return JSON.parse(localStorage.getItem(HKEY))||[]}catch(e){return []}
}
function saveHistory(h){localStorage.setItem(HKEY,JSON.stringify(h.slice(0,20)))}

function renderNames(){
  const box=document.getElementById('names');
  box.innerHTML='';
  state.names.forEach((name,i)=>{
    const el=document.createElement('input');
    el.className='name';
    el.value=name;
    el.placeholder='খেলোয়াড় '+(i+1);
    el.oninput=()=>{
      state.names[i]=el.value;
      save();
      renderHeaders();
      renderSummary();
    };
    box.appendChild(el);
  });
}
function renderHeaders(){
  for(let i=0;i<4;i++){
    document.getElementById('h'+i).textContent=state.names[i]||('খেলোয়াড় '+(i+1));
  }
}
function focusScore(el){
  // আগের পয়েন্টের সঙ্গে নতুন সংখ্যা জুড়ে না গিয়ে সহজে পুরোটা বদলানো যাবে।
  el.select();
}
function apply360Rule(r){
  const values=state.rounds[r];
  const total=values.reduce((sum,v)=>sum+(typeof v==='number'?v:0),0);
  // কেবল রাউন্ডের যোগফল ৩৬০ হলেই বাকি ফাঁকা ঘরে X বসবে।
  state.rounds[r]=values.map(v=>{
    if(total===360 && (v===null||v===undefined))return '×';
    if(total!==360 && v==='×')return null;
    return v;
  });
}
function makeScoreInput(cell,r,p,value=''){
  cell.innerHTML=`<input class="score" inputmode="numeric" pattern="[0-9]*" type="text" value="${value}" placeholder="—" autocomplete="off"
    onfocus="focusScore(this)" oninput="updateScoreLive(this,${r},${p})"
    onblur="blurScore(this,${r},${p})"
    onkeydown="if(event.key==='Enter')this.blur()">`;
}
function editX(r,p){
  state.rounds[r][p]=null;
  const row=document.querySelectorAll('#rows tr')[r];
  if(!row)return;
  makeScoreInput(row.children[p+1],r,p,'');
  save();
  updateRowDisplay(r);
  const input=row.children[p+1].querySelector('input');
  if(input){input.focus();input.select();}
}
function apply360Rule(r){
  const values=state.rounds[r];
  const total=values.reduce((sum,v)=>sum+(typeof v==='number'?v:0),0);
  state.rounds[r]=values.map(v=>{
    if(total===360&&(v===null||v===undefined))return '×';
    if(total!==360&&v==='×')return null;
    return v;
  });
}
function updateScoreLive(el,r,p){
  const raw=el.value.replace(/[^0-9]/g,'').trim();
  if(el.value!==raw)el.value=raw;
  state.rounds[r][p]=raw===''?null:Math.max(0,parseInt(raw,10)||0);
  apply360Rule(r);
  const row=el.closest('tr');
  for(let i=0;i<4;i++){
    if(i===p)continue;
    const cell=row.children[i+1],value=state.rounds[r][i];
    if(value==='×'){
      if(!cell.querySelector('.auto-x'))cell.innerHTML='<button type="button" class="score auto-x" onclick="editX('+r+','+i+')" aria-label="পয়েন্ট দিতে টাচ করুন">×</button>';
    }else if(!cell.querySelector('input.score')){
      makeScoreInput(cell,r,i,value??'');
    }
  }
  const values=state.rounds[r];
  const total=values.reduce((sum,v)=>sum+(typeof v==='number'?v:0),0);
  const completed=values.every(v=>v!==null&&v!==undefined);
  const status=row.querySelector('.status');
  row.querySelector('.total').textContent=total;
  status.textContent=completed?(total===360?'ঠিক ৩৬০':(total<360?'কম':'বেশি')):'চলছে';
  status.className='status '+(completed?(total===360?'ok':(total<360?'low':'high')):'low');
  save();renderSummary();
}
function addRound(){
  state.rounds.push([null,null,null,null]);
  save();
  render();
  const inputs=document.querySelectorAll('#rows tr:last-child .score');
  if(inputs.length)inputs[0].focus();
}
function blurScore(el,r,p){
  const raw=el.value.replace(/[^0-9]/g,'').trim();
  if(el.value!==raw)el.value=raw;
  state.rounds[r][p]=raw===''?null:Math.max(0,parseInt(raw,10)||0);
  apply360Rule(r);
  save();
  // Blur-এ কোনো DOM পরিবর্তন নয়: পাশের বক্সে টাচ করলে সেই ক্লিক অক্ষত থাকবে।
  const row=el.closest('tr');
  if(row){
    const values=state.rounds[r];
    const total=values.reduce((s,v)=>s+(typeof v==='number'?v:0),0);
    const done=values.every(v=>v!==null&&v!==undefined);
    row.querySelector('.total').textContent=total;
    const st=row.querySelector('.status');
    st.textContent=done?(total===360?'ঠিক ৩৬০':(total<360?'কম':'বেশি')):'চলছে';
    st.className='status '+(done?(total===360?'ok':(total<360?'low':'high')):'low');
  }
  renderSummary();
}
function updateRowDisplay(r){
  const row=document.querySelectorAll('#rows tr')[r];
  if(!row)return;
  for(let p=0;p<4;p++){
    const cell=row.children[p+1],v=state.rounds[r][p];
    if(v==='×'){
      if(!cell.querySelector('.auto-x'))cell.innerHTML='<button type="button" class="score auto-x" onclick="editX('+r+','+p+')" aria-label="পয়েন্ট দিতে টাচ করুন">×</button>';
    }else if(!cell.querySelector('input.score')){
      makeScoreInput(cell,r,p,v??'');
    }else if(document.activeElement!==cell.querySelector('input.score')){
      cell.querySelector('input.score').value=v??'';
    }
  }
  const total=state.rounds[r].reduce((s,v)=>s+(typeof v==='number'?v:0),0);
  const done=state.rounds[r].every(v=>v!==null&&v!==undefined);
  row.querySelector('.total').textContent=total;
  const st=row.querySelector('.status');
  st.textContent=done?(total===360?'ঠিক ৩৬০':(total<360?'কম':'বেশি')):'চলছে';
  st.className='status '+(done?(total===360?'ok':(total<360?'low':'high')):'low');
  renderSummary();
}
function renderSummary(){
  const totals=[0,0,0,0];
  state.rounds.forEach(a=>a.forEach((v,i)=>totals[i]+=typeof v==='number'?v:0));
  const max=Math.max(...totals);
  document.getElementById('summary').innerHTML=totals.map((v,i)=>
    `<div class="sum ${v===max&&max>0?'win':''}">
      ${escapeHtml(state.names[i]||('খেলোয়াড় '+(i+1)))}<b>${v}</b>
    </div>`
  ).join('');
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function render(){
  renderNames();
  renderHeaders();
  const rows=document.getElementById('rows');
  rows.innerHTML='';
  state.rounds.forEach((a,r)=>{
    const tr=document.createElement('tr');
    let cells=`<td class="round">${r+1}</td>`;
    for(let p=0;p<4;p++){
      if(a[p]==='×'){
        cells+=`<td><button type="button" class="score auto-x" onclick="editX(${r},${p})" aria-label="পয়েন্ট দিতে টাচ করুন">×</button></td>`;
      }else{
        const val=a[p]===null||a[p]===undefined?'':a[p];
        cells+=`<td>
          <input class="score" inputmode="numeric" pattern="[0-9]*" type="text" value="${val}" placeholder="—" autocomplete="off"
            onfocus="focusScore(this)" onclick="focusScore(this)"
            oninput="updateScoreLive(this,${r},${p})"
            onblur="blurScore(this,${r},${p})"
            onkeydown="if(event.key==='Enter')this.blur()">
        </td>`;
      }
    }
    const total=a.reduce((x,y)=>x+(typeof y==='number'?y:0),0);
    const completed=a.every(v=>v!==null&&v!==undefined);
    const cls=completed?(total===360?'ok':(total<360?'low':'high')):'low';
    const txt=completed?(total===360?'ঠিক ৩৬০':(total<360?'কম':'বেশি')):'চলছে';
    cells+=`<td><div class="total">${total}</div><div class="status ${cls}">${txt}</div></td>`;
    tr.innerHTML=cells;
    rows.appendChild(tr);
  });
  renderSummary();
  renderHistory();
}
function newGame(){
  const hasScore=state.rounds.some(a=>a.some(v=>v!==null&&v!==undefined&&v!=='×'));
  if(hasScore){
    const h=getHistory();
    h.unshift({
      time:new Date().toLocaleString('bn-BD'),
      names:[...state.names],
      rounds:state.rounds.map(a=>[...a])
    });
    saveHistory(h);
  }
  state={
    names:[...state.names],
    rounds:Array.from({length:ROUNDS},()=>[0,0,0,0])
  };
  save();
  render();
  window.scrollTo(0,0);
}
function toggleHistory(){
  const el=document.getElementById('history');
  el.style.display=el.style.display==='none'?'block':'none';
  renderHistory();
}
function renderHistory(){
  const list=document.getElementById('historyList');
  const h=getHistory();
  if(!h.length){
    list.innerHTML='<div style="font-size:10px;color:#7b8497">কোনো পুরোনো গেম নেই</div>';
    return;
  }
  list.innerHTML=h.map((g,i)=>{
    const totals=[0,0,0,0];
    g.rounds.forEach(a=>a.forEach((v,p)=>totals[p]+=typeof v==='number'?v:0));
    return `<div class="history-item">
      <div class="info">${escapeHtml(g.time)}<br>${escapeHtml(g.names.join(' · '))}<br>${totals.join(' / ')}</div>
      <div class="buttons">
        <button class="secondary" onclick="restoreGame(${i})">Restore</button>
        <button class="secondary" onclick="deleteHistory(${i})">Delete</button>
      </div>
    </div>`;
  }).join('');
}
function restoreGame(i){
  const h=getHistory();
  if(!h[i])return;
  state={
    names:[...h[i].names],
    rounds:h[i].rounds.map(a=>a.map(v=>v==='×'?'×':(v===null||v===undefined?null:Number(v))))
  };
  save();
  render();
  document.getElementById('history').style.display='none';
  window.scrollTo(0,0);
}
function deleteHistory(i){
  const h=getHistory();
  h.splice(i,1);
  saveHistory(h);
  renderHistory();
}
render();
</script>
</body>
</html>
